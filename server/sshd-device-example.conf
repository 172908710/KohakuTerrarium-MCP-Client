# SSH hardening template for one additional device.
# Replace 18766 with the registry allocation and add one Match block per
# device. The current live SSH policy still allows only production 18765; this
# example is not installed.
#
# Match User kt-mcp-device-01
#     AuthenticationMethods publickey
#     PasswordAuthentication no
#     KbdInteractiveAuthentication no
#     AllowTcpForwarding remote
#     AllowStreamLocalForwarding no
#     PermitListen 127.0.0.1:18766
#     PermitOpen none
#     GatewayPorts no
#     AllowAgentForwarding no
#     X11Forwarding no
#     PermitTTY no
#     PermitTunnel no
#     PermitUserRC no
#     MaxSessions 0
#     ClientAliveInterval 30
#     ClientAliveCountMax 3
